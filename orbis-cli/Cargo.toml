[package]
name = "orbis-cli"
version = "0.3.0"
default-run = "orbis"
edition = "2024"
description = "PS4 PKG extractor, integrity checker, and update installer for Windows, Linux, and macOS"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ps4", "playstation", "pkg", "extract", "orbis"]
categories = ["command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:ctrlc", "dep:indicatif"]

[dependencies]
orbis-integrity.workspace = true
cap-std = "4.0.3"
fastrand = "2"
memmap2 = "0.9"
rayon = "1.10"
orbis-pkg.workspace = true
orbis-pfs.workspace = true
snafu.workspace = true
clap_complete = { version = "4.5", optional = true }
ctrlc = { version = "3.5", optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2.workspace = true
fs2 = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winx = "0.36.4"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.indicatif]
version = "0.17"
optional = true

[[bin]]
name = "orbis"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "orbis-pkg-util"
path = "src/bin/orbis-pkg-util.rs"
required-features = ["cli"]

[dev-dependencies]
aes.workspace = true
sha2.workspace = true
cbc = "0.1.2"
hmac = "0.12.1"
xts-mode = "0.5.1"
rsa = "0.9"
rand = "0.8"
flate2 = "1.1.9"
tempfile = "3"
