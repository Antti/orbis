[package]
name = "orbis-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop app for extracting PS4 packages and installing full-file updates"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
orbis-cli = { version = "0.3.0", path = "../orbis-cli", default-features = false }
orbis-pkg.workspace = true
orbis-pfs.workspace = true

[dev-dependencies]
tempfile = "3"
rsa = "0.9"
rand = "0.8"
