<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="224" viewBox="0 0 1200 224" role="img" aria-labelledby="title description">
  <title id="title">Orbis — PS4 package tools</title>
  <desc id="description">Desktop app and command line. The teal Orbis package mark sits inside two orbital rings on a navy background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2=".35">
      <stop stop-color="#102438"/>
      <stop offset="1" stop-color="#183950"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#70c8cc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#70c8cc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="224" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="224" fill="url(#background)"/>
    <ellipse cx="965" cy="112" rx="320" ry="212" fill="url(#glow)"/>
    <g fill="none" stroke="#70c8cc" transform="rotate(-18 965 112)">
      <ellipse cx="965" cy="112" rx="190" ry="74" stroke-opacity=".45"/>
      <ellipse cx="965" cy="112" rx="254" ry="104" stroke-opacity=".22"/>
      <circle cx="775" cy="112" r="4" fill="#70c8cc" stroke="none"/>
    </g>
    <!-- Match the package mark in packaging/io.github.Antti.Orbis.svg. -->
    <g transform="translate(893 40) scale(1.125)">
      <rect x="4" y="4" width="120" height="120" rx="24" fill="#17324d"/>
      <path d="M64 22 104 43v43L64 108 24 86V43Z" fill="#70c8cc"/>
      <path d="m24 43 40 22 40-22M64 65v43M44 33l40 22v20" fill="none" stroke="#17324d" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="54" y="113" fill="#f4f8fb" font-size="66" font-weight="700" letter-spacing="-2">PS4 package tools</text>
      <text x="57" y="162" fill="#bddee1" font-size="30">Desktop app and command line</text>
    </g>
  </g>
</svg>
