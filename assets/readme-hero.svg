<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Orbis — PS4 package tools</title>
  <desc id="description">A navy banner with the Orbis name, Rust CLI and libraries subtitle, and the teal package logo surrounded by orbital lines.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102438"/>
      <stop offset="1" stop-color="#17324d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#70c8cc" stop-opacity=".13"/>
      <stop offset="1" stop-color="#70c8cc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="280" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)"/>
    <ellipse cx="1000" cy="140" rx="360" ry="260" fill="url(#glow)"/>
    <g fill="none" stroke="#70c8cc" transform="rotate(-18 1000 140)">
      <ellipse cx="1000" cy="140" rx="216" ry="102" stroke-opacity=".22"/>
      <ellipse cx="1000" cy="140" rx="288" ry="164" stroke-opacity=".1"/>
      <circle cx="784" cy="140" r="4" fill="#70c8cc" stroke="none"/>
      <circle cx="1288" cy="140" r="3" fill="#70c8cc" fill-opacity=".5" stroke="none"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="56" y="58" fill="#70c8cc" font-size="13" font-weight="600" letter-spacing="2.4">RUST CLI + LIBRARIES</text>
      <text x="52" y="155" fill="#f4f8fb" font-size="80" font-weight="700" letter-spacing="-2">Orbis</text>
      <text x="56" y="205" fill="#c1d3e1" font-size="24">PS4 package tools</text>
    </g>
    <!-- Keep the package mark aligned with packaging/io.github.Antti.Orbis.svg. -->
    <g transform="translate(920 60) scale(1.25)">
      <rect x="4" y="4" width="120" height="120" rx="24" fill="#17324d"/>
      <path d="M64 22 104 43v43L64 108 24 86V43Z" fill="#70c8cc"/>
      <path d="m24 43 40 22 40-22M64 65v43M44 33l40 22v20" fill="none" stroke="#17324d" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
