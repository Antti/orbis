[workspace]
resolver = "3"
members = ["orbis-integrity", "orbis-pfs", "orbis-pkg", "orbis-cli", "orbis-desktop"]
default-members = ["orbis-integrity", "orbis-pfs", "orbis-pkg", "orbis-cli"]
exclude = ["fuzz"]

[workspace.package]
authors = ["videobitva", "Andrii Dmytrenko"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Antti/orbis"
homepage = "https://github.com/Antti/orbis"

[workspace.dependencies]
orbis-integrity = { version = "0.1.0", path = "orbis-integrity" }
aes = { version = "0.8.4" }
sha2 = { version = "0.10.9" }
snafu = { version = "0.8.9" }
zerocopy = { version = "0.8.38" }

orbis-pfs = { version = "0.1.0", path = "orbis-pfs" }
orbis-pkg = { version = "0.1.0", path = "orbis-pkg" }
orbis-cli = { version = "0.4.0", path = "orbis-cli" }
